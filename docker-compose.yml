version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: legal_events_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legal_events}
      POSTGRES_USER: ${POSTGRES_USER:-legal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-generate-strong-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_user -d legal_events"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for job queue and caching
  redis:
    image: redis:7-alpine
    container_name: legal_events_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: legal_events_minio
    ports:
      - "9000:9000"     # API port
      - "9001:9001"     # Console port (web UI)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-generate-strong-password}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: legal_events_api
    ports:
      - "8000:8000"
    environment:
      # Application Environment (development enables JWT fallback)
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-legal_user}:${POSTGRES_PASSWORD:-generate-strong-password}@postgres:5432/${POSTGRES_DB:-legal_events}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-generate-strong-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-legal-documents}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      PYTHONUNBUFFERED: 1
      # Copy over any existing API keys from .env
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      API_KEY_ADMIN: ${API_KEY_ADMIN:-}
      API_KEY_USER: ${API_KEY_USER:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        echo 'Waiting for database...'
        sleep 5
        python3 << 'PYEOF'
        import psycopg2
        import sys
        import os

        conn = None
        cur = None
        try:
          # Use DATABASE_URL from environment instead of hardcoded connection
          db_url = os.environ.get('DATABASE_URL')
          if not db_url:
            print("ERROR: DATABASE_URL environment variable not set", file=sys.stderr)
            sys.exit(1)
          conn = psycopg2.connect(db_url)
          cur = conn.cursor()
          sqls = [
            "DO $$$$ BEGIN CREATE TYPE userrole AS ENUM ('admin', 'case_manager', 'reviewer'); EXCEPTION WHEN duplicate_object THEN null; END $$$$;",
            "DO $$$$ BEGIN CREATE TYPE runstatus AS ENUM ('queued', 'processing', 'partial', 'success', 'failed'); EXCEPTION WHEN duplicate_object THEN null; END $$$$;",
            "DO $$$$ BEGIN CREATE TYPE documentstatus AS ENUM ('pending', 'processing', 'success', 'failed'); EXCEPTION WHEN duplicate_object THEN null; END $$$$;",
            "DO $$$$ BEGIN CREATE TYPE clientstatus AS ENUM ('active', 'inactive', 'suspended'); EXCEPTION WHEN duplicate_object THEN null; END $$$$;",
            "DO $$$$ BEGIN CREATE TYPE casestatus AS ENUM ('open', 'closed', 'archived'); EXCEPTION WHEN duplicate_object THEN null; END $$$$;"
          ]
          for sql in sqls:
            cur.execute(sql)
          conn.commit()
          print("Successfully created PostgreSQL ENUM types")
        except psycopg2.OperationalError as e:
          print(f"Database connection error: {e}", file=sys.stderr)
          sys.exit(1)
        except psycopg2.Error as e:
          print(f"SQL execution error: {e}", file=sys.stderr)
          sys.exit(1)
        except Exception as e:
          print(f"Unexpected error during ENUM creation: {e}", file=sys.stderr)
          sys.exit(1)
        finally:
          if cur:
            cur.close()
          if conn:
            conn.close()
        PYEOF
        alembic upgrade head
        uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  # Background Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: legal_events_worker
    environment:
      # Application Environment
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-legal_user}:${POSTGRES_PASSWORD:-generate-strong-password}@postgres:5432/${POSTGRES_DB:-legal_events}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-generate-strong-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-legal-documents}
      PYTHONUNBUFFERED: 1
      # Copy over any existing API keys
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      - redis
      - postgres
      - minio
    command: python -m worker.main

  # Simple UI (initially, we'll enhance Flask before moving to SvelteKit)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: legal_events_ui
    ports:
      - "3000:80"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: legal_events_network
